services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: bookstack
      POSTGRES_PASSWORD: bookstackpw
      POSTGRES_DB: bookstackdb
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bookstack -d bookstackdb"]
      interval: 5s
      timeout: 5s
      retries: 5

  catalog:
    build:
      context: .
      dockerfile: BookStack.Server.Catalog/Dockerfile
    environment:
      - ConnectionStrings__Default=Host=db;Port=5432;Database=bookstackdb;Username=bookstack;Password=bookstackpw
      - ASPNETCORE_ENVIRONMENT=Development
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

  pgadmin:
    image: dpage/pgadmin4:latest
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@bookstack.local
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - db

volumes:
  db_data:
